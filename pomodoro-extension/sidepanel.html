<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tomato Pomodoro Timer</title>
<link rel="stylesheet" href="styles/sidepanel.css">
</head>
<body>

<header id="top-bar">
  <span id="app-title">tomato timer <span id="app-version"></span></span>
  <button id="settings-btn" class="icon-btn" aria-label="Settings">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M9.2502 22L8.8502 18.8C8.63353 18.7167 8.42936 18.6167 8.2377 18.5C8.04603 18.3833 7.85853 18.2583 7.6752 18.125L4.7002 19.375L1.9502 14.625L4.5252 12.675C4.50853 12.5583 4.5002 12.4458 4.5002 12.3375V11.6625C4.5002 11.5542 4.50853 11.4417 4.5252 11.325L1.9502 9.375L4.7002 4.625L7.6752 5.875C7.85853 5.74167 8.0502 5.61667 8.2502 5.5C8.4502 5.38333 8.6502 5.28333 8.8502 5.2L9.2502 2H14.7502L15.1502 5.2C15.3669 5.28333 15.571 5.38333 15.7627 5.5C15.9544 5.61667 16.1419 5.74167 16.3252 5.875L19.3002 4.625L22.0502 9.375L19.4752 11.325C19.4919 11.4417 19.5002 11.5542 19.5002 11.6625V12.3375C19.5002 12.4458 19.4835 12.5583 19.4502 12.675L22.0252 14.625L19.2752 19.375L16.3252 18.125C16.1419 18.2583 15.9502 18.3833 15.7502 18.5C15.5502 18.6167 15.3502 18.7167 15.1502 18.8L14.7502 22H9.2502ZM12.0502 15.5C13.0169 15.5 13.8419 15.1583 14.5252 14.475C15.2085 13.7917 15.5502 12.9667 15.5502 12C15.5502 11.0333 15.2085 10.2083 14.5252 9.525C13.8419 8.84167 13.0169 8.5 12.0502 8.5C11.0669 8.5 10.2377 8.84167 9.5627 9.525C8.8877 10.2083 8.5502 11.0333 8.5502 12C8.5502 12.9667 8.8877 13.7917 9.5627 14.475C10.2377 15.1583 11.0669 15.5 12.0502 15.5Z" fill="currentColor"/>
    </svg>
  </button>
</header>

<main id="timer-app">
  <div id="timer-row">
    <div id="timer-display">25:00</div>
  </div>

  <div id="tomato-row">
    <div id="canvas-wrap">
      <canvas id="three-canvas"></canvas>
      <div id="loading">Loading tomato&hellip;</div>
    </div>
    <div id="dial-controls">
      <button id="chevron-up" class="chevron-btn" aria-label="Increase time">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M7 14L12 9L17 14H7Z" fill="currentColor"/>
        </svg>
      </button>
      <button id="chevron-down" class="chevron-btn" aria-label="Decrease time">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M7 10L12 15L17 10H7Z" fill="currentColor"/>
        </svg>
      </button>
    </div>
  </div>

  <div id="controls-row">
    <button id="play-btn" class="play-btn" aria-label="Start">
      <svg id="play-icon" viewBox="0 0 120 120" width="28" height="28" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M40 95V25L95 60L40 95Z" fill="currentColor"/>
      </svg>
      <svg id="pause-icon" class="icon-hidden" viewBox="0 0 24 24" width="24" height="24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M14 19V5H18V19H14ZM6 19V5H10V19H6Z" fill="currentColor"/>
      </svg>
    </button>
    <button id="preset-btn" class="icon-btn" aria-label="Cycle session type to add">
      <svg viewBox="0 0 43 43" width="20" height="20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M21.5002 39.4167C19.2606 39.4167 17.1629 38.9912 15.207 38.1401C13.2511 37.2891 11.549 36.1394 10.1007 34.6912C8.65245 33.2429 7.5028 31.5408 6.65176 29.5849C5.80072 27.629 5.3752 25.5313 5.3752 23.2917C5.3752 21.0521 5.80072 18.9544 6.65176 16.9985C7.5028 15.0426 8.65245 13.3405 10.1007 11.8922C11.549 10.444 13.2511 9.2943 15.207 8.44326C17.1629 7.59222 19.2606 7.1667 21.5002 7.1667C23.7398 7.1667 25.8375 7.59222 27.7934 8.44326C29.7493 9.2943 31.4514 10.444 32.8997 11.8922C34.3479 13.3405 35.4976 15.0426 36.3486 16.9985C37.1997 18.9544 37.6252 21.0521 37.6252 23.2917C37.6252 25.5313 37.1997 27.629 36.3486 29.5849C35.4976 31.5408 34.3479 33.2429 32.8997 34.6912C31.4514 36.1394 29.7493 37.2891 27.7934 38.1401C25.8375 38.9912 23.7398 39.4167 21.5002 39.4167ZM26.5169 30.8167L29.0252 28.3084L23.2919 22.575V14.3334H19.7085V24.0084L26.5169 30.8167ZM10.0335 4.21045L12.5419 6.71878L4.92728 14.3334L2.41895 11.825L10.0335 4.21045ZM32.9669 4.21045L40.5814 11.825L38.0731 14.3334L30.4585 6.71878L32.9669 4.21045Z" fill="currentColor"/>
      </svg>
    </button>
  </div>

  <section id="queue-panel">
    <h2 id="queue-heading" hidden>up next</h2>
    <ul id="queue-list"></ul>
    <button id="add-queue-btn" class="queue-add-btn">+ Add to queue</button>
  </section>
</main>

<div id="settings-overlay" hidden>
  <div id="settings-panel" role="dialog" aria-label="Settings">
    <h2>Settings</h2>
    <label class="settings-row">
      <span>Pomodoro</span>
      <input type="number" id="setting-pomodoro" min="5" max="35" step="5">
      <span>min</span>
    </label>
    <label class="settings-row">
      <span>Short break</span>
      <input type="number" id="setting-short" min="5" max="35" step="5">
      <span>min</span>
    </label>
    <label class="settings-row">
      <span>Long break</span>
      <input type="number" id="setting-long" min="5" max="35" step="5">
      <span>min</span>
    </label>
    <button id="settings-close-btn" class="primary-pill">Done</button>
  </div>
</div>

<script type="module" src="scripts/sidepanel.js"></script>
</body>
</html>
